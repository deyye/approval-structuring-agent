name: approval-structuring-agent
services:
  app:
    build: .
    image: approval-structuring-agent:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-8765}:8765"
    environment:
      HOST: 0.0.0.0
      PORT: 8765
      DATA_DIR: /app/data
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      VISION_MODEL: ${VISION_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-true}
      LLM_EXTRA_BODY: '${LLM_EXTRA_BODY:-}'
      LLM_ALLOW_NO_KEY: ${LLM_ALLOW_NO_KEY:-false}
      LLM_HTTP_HOSTS: ${LLM_HTTP_HOSTS:-}
    volumes:
      - approval-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  approval-data:
