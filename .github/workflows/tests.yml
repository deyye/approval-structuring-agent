name: Tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update && sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim
      - run: python scripts/check_ocr.py
      - run: python scripts/demo.py --data /tmp/approval-demo
      - run: python scripts/evaluate.py --samples /tmp/approval-demo/demo-source --out /tmp/approval-evaluation
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and start non-root service
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Verify Chinese OCR and non-root user
        run: |
          docker compose exec -T app python -c "import os; assert os.getuid() == 10001"
          docker compose exec -T app python -c "import subprocess; assert 'chi_sim' in subprocess.check_output(['tesseract','--list-langs'], text=True)"
      - name: Upload, review, highlight and export
        run: python scripts/docker_smoke.py
      - name: Recreate container with existing data volume
        run: docker compose up -d --force-recreate --wait --wait-timeout 120
      - name: Verify persistence
        run: python scripts/docker_smoke.py --verify-persistence
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Remove disposable CI containers and data
        if: always()
        run: docker compose down -v
